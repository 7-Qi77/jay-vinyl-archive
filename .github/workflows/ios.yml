name: Build iOS package

on:
  workflow_dispatch:
    inputs:
      signed:
        description: '用 Secrets 中的证书签名（需付费开发者账号）'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'styles.css'
      - 'js/**'
      - 'assets/**'
      - 'capacitor.config.json'
      - 'scripts/**'
      - 'package.json'
      - '.github/workflows/ios.yml'

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装依赖
        run: npm install --no-audit --no-fund

      - name: 生成 webDir
        run: npm run build:ios-web

      - name: 生成 iOS 工程
        run: npx cap add ios

      - name: 同步 web 资源
        run: npx cap sync ios

      - name: 生成图标与启动屏
        run: npx @capacitor/assets generate --ios

      - name: 修补 Info.plist / AppDelegate
        run: node scripts/ios-postsync.mjs

      # ── 免费路线：未签名 IPA，交给 Windows 上的 Sideloadly / AltStore 签名 ──
      - name: 编译（未签名）
        if: ${{ !inputs.signed }}
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace \
            -scheme App -configuration Release -sdk iphoneos \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry JayVinyl-unsigned.ipa Payload

      # ── 付费路线：需要以下 Secrets ──
      # BUILD_CERTIFICATE_BASE64 / P12_PASSWORD
      # PROVISIONING_PROFILE_BASE64 / TEAM_ID / BUNDLE_ID
      - name: 导入签名证书
        if: ${{ inputs.signed }}
        env:
          CERT_B64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROFILE_B64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          echo "$CERT_B64" | base64 --decode > cert.p12
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE_B64" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import cert.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain

      - name: 编译并导出（已签名）
        if: ${{ inputs.signed }}
        env:
          TEAM_ID: ${{ secrets.TEAM_ID }}
          BUNDLE_ID: ${{ secrets.BUNDLE_ID }}
        run: |
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>development</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
          </dict>
          </plist>
          EOF
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App \
            -configuration Release -sdk iphoneos -derivedDataPath build \
            DEVELOPMENT_TEAM="$TEAM_ID" PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            archive -archivePath build/App.xcarchive
          xcodebuild -exportArchive -archivePath build/App.xcarchive \
            -exportOptionsPlist ExportOptions.plist -exportPath build/export

      - uses: actions/upload-artifact@v4
        with:
          name: ios-package
          path: |
            JayVinyl-unsigned.ipa
            build/export/*.ipa
          if-no-files-found: warn
          retention-days: 14
