name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'styles.css'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'js/**'
      - 'assets/**'
      - 'tests/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 只把线上需要的文件装进 _site，tools / tests / scripts 不对外发布
      - name: 组装发布目录
        run: |
          mkdir -p _site
          cp index.html styles.css sw.js manifest.webmanifest _site/
          cp -R js _site/js
          cp -R assets _site/assets
          # 源 MP3 只留在仓库归档，线上只发布转码后的 M4A，减小 Pages artifact
          find _site/assets/audio -maxdepth 1 -type f -name '*.mp3' -delete

      # 第三方组件体量大，发布前统一压缩；Pages 仍会再做 gzip。
      - name: 压缩 vendor JS
        run: |
          set -euo pipefail
          find _site/assets/vendor -type f -name '*.js' -print0 | while IFS= read -r -d '' f; do
            npx --yes esbuild@0.25.3 "$f" --minify --outfile="$f.min" >/dev/null
            mv "$f.min" "$f"
          done

      - name: 发布前冒烟检查
        run: node tests/deploy-check.mjs _site

      - name: 发布体积
        run: |
          du -sh _site
          find _site -maxdepth 2 -mindepth 1 | sort

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
