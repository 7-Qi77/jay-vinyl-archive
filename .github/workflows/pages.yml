name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'styles.css'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'js/**'
      - 'assets/**'
      - 'tests/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装锁定依赖
        run: npm ci

      - name: 构建并校验发布目录
        run: npm run build:web -- _site

      - name: 安装测试浏览器
        run: npx playwright install --with-deps chromium

      - name: 发布产物功能回归
        run: |
          python -m http.server 4173 --directory _site > /tmp/jc-pages.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          BASE_URL=http://127.0.0.1:4173 BROWSER_CHANNEL=chromium npm run test:smoke

      - name: 发布产物无障碍回归
        run: |
          python -m http.server 4173 --directory _site > /tmp/jc-pages.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          BASE_URL=http://127.0.0.1:4173 BROWSER_CHANNEL=chromium npm run test:a11y

      - name: 发布产物性能预算
        continue-on-error: true
        run: |
          python -m http.server 4173 --directory _site > /tmp/jc-pages.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          BASE_URL=http://127.0.0.1:4173 BROWSER_CHANNEL=chromium PERF_CPU_THROTTLE=1 npm run test:perf

      - name: 发布体积
        run: |
          du -sh _site
          find _site -maxdepth 2 -mindepth 1 | sort

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
